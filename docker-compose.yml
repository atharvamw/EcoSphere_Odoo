version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecosphere_postgres
    restart: always
    environment:
      POSTGRES_USER: ecosphere_user
      POSTGRES_PASSWORD: ecosphere_pass
      POSTGRES_DB: ecosphere_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ecosphere_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: ecosphere_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_admin_pass
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  backend:
    build: ./backend
    container_name: ecosphere_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgres://ecosphere_user:ecosphere_pass@postgres:5432/ecosphere_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app

  celery:
    build: ./backend
    container_name: ecosphere_celery
    restart: always
    command: celery -A ecosphere worker -l info
    environment:
      - DEBUG=True
      - DATABASE_URL=postgres://ecosphere_user:ecosphere_pass@postgres:5432/ecosphere_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app

  frontend:
    build: ./client
    container_name: ecosphere_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
  minio_data:
